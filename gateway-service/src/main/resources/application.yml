server:
  port: 8080

spring:
  application:
    name: gateway-service
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: account-service-routes
              uri: lb://account-service
              predicates:
                - Path=/api/accounts/**,/api/transfers/**,/graphql/accounts
            - id: transaction-service-routes
              uri: lb://transaction-service
              predicates:
                - Path=/api/transactions/**,/graphql/transactions
            - id: chatbot-service-routes
              uri: lb://chatbot-service
              predicates:
                - Path=/api/chat/**
